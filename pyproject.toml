[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwt-x-sentiment-agent"
version = "0.1.0"
description = "Reproducible X sentiment and BTC price research pipeline for the CWT internship assessment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "apify-client>=1.7,<3",
  "vaderSentiment>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
cwt-agent = "cwt_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
